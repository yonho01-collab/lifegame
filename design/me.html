<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="dsh-design" content="app" />
    <title>我 · 人生游戏</title>
    <link rel="stylesheet" href="app.css" />
    <style>
      .me-head {
        position: relative;
        height: 150px;
        background: #0e0e10 url("assets/morning.jpg") center 82% / cover no-repeat;
      }
      .me-head::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(14, 14, 16, 0.35) 0%, rgba(14, 14, 16, 0.2) 55%, #0e0e10 100%);
      }
      .me-head .statusbar {
        position: relative;
        z-index: 1;
      }


      .daycount {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin: 2px 0 28px;
      }
      .daycount .n {
        font-family: var(--font-serif);
        font-size: 26px;
        line-height: 1.3;
        letter-spacing: 0.04em;
        color: var(--primary);
      }
      .daycount .t {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.04em;
      }

      .traces {
        display: grid;
        grid-template-columns: repeat(15, 1fr);
        gap: 5px;
        margin-bottom: 10px;
      }
      .traces i {
        aspect-ratio: 1;
        border-radius: 2px;
        background: var(--surface-3);
      }
      .traces i.on {
        background: rgba(201, 168, 106, 0.75);
      }
      .traces i.is-today {
        box-shadow: 0 0 0 1px var(--primary);
        background: rgba(201, 168, 106, 0.25);
      }
      .traces-axis {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.06em;
        margin-bottom: 30px;
      }

      .change {
        margin: 0;
      }
      .change-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
      }
      .change-row:last-child {
        border-bottom: 0;
      }
      .change-row .k {
        font-family: var(--font-serif);
        font-size: 16px;
        letter-spacing: 0.12em;
        color: var(--text);
      }
      .change-row .v {
        font-size: 12px;
        letter-spacing: 0.04em;
        color: var(--primary);
      }
      .change-row .v.flat {
        color: var(--muted);
      }


      .link-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 60px;
        border-bottom: 1px solid var(--line);
      }
      .link-row:last-child {
        border-bottom: 0;
      }
      .link-row .k {
        font-size: 16px;
        color: var(--text);
      }
      .link-row .s {
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }
      .link-row .v {
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header class="me-head">
      <div class="statusbar">
        <span class="num">21:04</span>
        <span class="status-icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor" aria-hidden="true">
            <rect x="0" y="7" width="3" height="4" rx="1" />
            <rect x="4.5" y="5" width="3" height="6" rx="1" />
            <rect x="9" y="2.5" width="3" height="8.5" rx="1" />
            <rect x="13.5" y="0" width="3" height="11" rx="1" />
          </svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true">
            <path d="M8 11.2 5.5 8.3a3.5 3.5 0 0 1 5 0L8 11.2Z" />
            <path d="M8 6.4c-1.7 0-3.2.6-4.4 1.8L2.4 6.9A8 8 0 0 1 8 4.5c2.2 0 4.2.9 5.6 2.4l-1.2 1.3A6.2 6.2 0 0 0 8 6.4Z" opacity=".85" />
          </svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true">
            <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" opacity=".4" />
            <rect x="2" y="2" width="15" height="8" rx="1.5" fill="currentColor" />
            <path d="M23 4.2v3.6a2.1 2.1 0 0 0 0-3.6Z" fill="currentColor" opacity=".4" />
          </svg>
        </span>
      </div>
    </header>

    <main class="page has-tabbar" style="padding-top: 16px">
      <div class="daycount">
        <span class="n">第 47 天</span>
        <span class="t">在这里留下 63 条</span>
      </div>

      <div class="traces">
        <i class="on"></i><i></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i></i><i class="on"></i><i></i>
        <i class="on"></i><i></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i></i><i class="on"></i><i></i><i></i><i class="on"></i><i></i>
        <i class="on"></i><i></i><i></i><i class="on"></i><i></i><i></i><i class="on"></i><i></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i class="on"></i><i></i>
        <i class="on"></i><i></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i></i><i class="on"></i>
        <i></i><i class="on"></i><i></i><i></i><i class="on"></i><i></i><i></i><i class="on"></i><i></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i></i>
        <i class="on"></i><i></i><i></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i></i><i class="is-today"></i>
      </div>
      <div class="traces-axis">
        <span>11月1日</span>
        <span>今天</span>
      </div>

      <p class="section-label" style="margin-top: 0">从开始到现在</p>
      <div class="change">
        <div class="change-row">
          <span class="k">耐心</span>
          <span class="v">长了一点</span>
        </div>
        <div class="change-row">
          <span class="k">轻盈</span>
          <span class="v">长了一点</span>
        </div>
        <div class="change-row">
          <span class="k">专注</span>
          <span class="v flat">没怎么动</span>
        </div>
        <div class="change-row">
          <span class="k">健康</span>
          <span class="v">长了很多</span>
        </div>
      </div>

      <p class="section-label" style="margin-top: 32px">设置</p>
      <a class="link-row" href="#">
        <div>
          <div class="k">节律与预算</div>
          <div class="s">睡觉目标 00:30 · 冥想 10 分钟 · 月预算 ¥500–1500</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="var(--muted)" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M7 4l5 5-5 5" /></svg>
      </a>
      <a class="link-row" href="#">
        <div>
          <div class="k">日历</div>
          <div class="s">飞书日历 · 只读忙闲与标题</div>
        </div>
        <span class="v">已连</span>
      </a>
      <a class="link-row" href="#">
        <div>
          <div class="k">导出全部记录</div>
          <div class="s">JSON · 永远是你的</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="var(--muted)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3v8M5.8 8 9 11.2 12.2 8M3 13.4v1.2h12v-1.2" /></svg>
      </a>

      <p class="footnote" style="margin-top: 24px; text-align: center">
        没有积分、没有等级、没有连续天数。只有四个词。
      </p>
    </main>

    <nav class="tabbar">
      <a class="tab" href="today.html">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
          <circle cx="10" cy="10" r="6.2" />
          <path d="M10 1.4v2.2M10 16.4v2.2M1.4 10h2.2M16.4 10h2.2" />
        </svg>
        <span>今天</span>
      </a>
      <a class="tab" href="week.html">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
          <rect x="2.6" y="4.2" width="14.8" height="13" rx="3" />
          <path d="M6.4 2.6v3M13.6 2.6v3M2.6 8.6h14.8" />
        </svg>
        <span>本周</span>
      </a>
      <a class="tab is-active" href="me.html">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
          <circle cx="10" cy="10" r="3.2" />
          <path d="M10 1.6v2.6M10 15.8v2.6M1.6 10h2.6M15.8 10h2.6" />
        </svg>
        <span>我</span>
      </a>
    </nav>
  </body>
</html>

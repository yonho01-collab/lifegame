<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="dsh-design" content="app" />
    <title>本周 · 人生游戏</title>
    <link rel="stylesheet" href="app.css" />
    <style>
      .ev {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 16px;
        background: var(--surface);
        border-radius: var(--radius);
        margin-bottom: 10px;
      }
      .ev-mark {
        width: 22px;
        height: 22px;
        flex: 0 0 auto;
        margin-top: 2px;
        border-radius: 50%;
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        color: transparent;
      }
      .ev.done .ev-mark {
        border-color: var(--primary);
        background: var(--primary);
        color: var(--on-primary);
      }
      .ev-body {
        flex: 1 1 auto;
        min-width: 0;
      }
      .ev h3 {
        font-family: var(--font-serif);
        font-weight: 500;
        font-size: 16px;
        line-height: 1.5;
        letter-spacing: 0.03em;
        margin: 0 0 8px;
        color: var(--text);
      }
      .ev.done h3 {
        color: var(--muted);
        text-decoration: line-through;
        text-decoration-color: var(--line);
        text-decoration-thickness: 1px;
      }
      .ev-when {
        font-size: 12px;
        color: var(--primary);
        letter-spacing: 0.04em;
        margin: 0 0 6px;
      }
      .ev.done .ev-when {
        color: var(--muted);
      }
      .quote {
        font-size: 13px;
        line-height: 1.7;
        color: var(--muted);
        border-left: 1px solid var(--line);
        padding-left: 10px;
        margin-top: 10px;
      }
      .switch-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 16px;
        background: var(--surface);
        border-radius: var(--radius);
        min-height: 64px;
      }
      .switch {
        position: relative;
        width: 48px;
        height: 30px;
        flex: 0 0 auto;
      }
      .switch input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
      }
      .switch span {
        position: absolute;
        inset: 0;
        border-radius: var(--radius-pill);
        background: var(--surface-3);
        border: 1px solid var(--line);
        transition: background 0.2s var(--ease);
      }
      .switch span::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--muted);
        transition: transform 0.2s var(--ease), background 0.2s var(--ease);
      }
      .switch input:checked + span {
        background: rgba(201, 168, 106, 0.18);
        border-color: rgba(201, 168, 106, 0.5);
      }
      .switch input:checked + span::after {
        transform: translateX(18px);
        background: var(--primary);
      }
    </style>
  </head>
  <body>
    <div class="statusbar">
      <span class="num">9:41</span>
      <span class="status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor" aria-hidden="true">
          <rect x="0" y="7" width="3" height="4" rx="1" />
          <rect x="4.5" y="5" width="3" height="6" rx="1" />
          <rect x="9" y="2.5" width="3" height="8.5" rx="1" />
          <rect x="13.5" y="0" width="3" height="11" rx="1" />
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true">
          <path d="M8 11.2 5.5 8.3a3.5 3.5 0 0 1 5 0L8 11.2Z" />
          <path d="M8 6.4c-1.7 0-3.2.6-4.4 1.8L2.4 6.9A8 8 0 0 1 8 4.5c2.2 0 4.2.9 5.6 2.4l-1.2 1.3A6.2 6.2 0 0 0 8 6.4Z" opacity=".85" />
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true">
          <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" opacity=".4" />
          <rect x="2" y="2" width="15" height="8" rx="1.5" fill="currentColor" />
          <path d="M23 4.2v3.6a2.1 2.1 0 0 0 0-3.6Z" fill="currentColor" opacity=".4" />
        </svg>
      </span>
    </div>

    <main class="page has-tabbar">
      <div class="topline">
        <span>11月24日 – 11月30日</span>
        <span>第 4 周</span>
      </div>
      <h1 class="title">本周</h1>
      <div class="row" style="margin: 12px 0 8px">
        <span class="footnote">选了 2 件 · 完成 1 件</span>
        <span class="footnote num">1 / 2</span>
      </div>
      <div class="progress" style="margin-bottom: 24px"><i style="width: 50%"></i></div>

      <div class="ev done">
        <span class="ev-mark">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.6 7.4 5.6 10.4l5.8-6.4" />
          </svg>
        </span>
        <div class="ev-body">
          <p class="ev-when">周三 · 已完成</p>
          <h3>90 分钟无手机电影</h3>
          <div class="meta"><span>审美</span><span class="dot"></span><span>90 分钟</span></div>
          <p class="quote">看《海街日记》。前 20 分钟手一直想去摸口袋，之后就没了。</p>
        </div>
      </div>

      <div class="ev">
        <span class="ev-mark"></span>
        <div class="ev-body">
          <p class="ev-when">周六 10:00</p>
          <h3>去城市另一头那家开了 30 年的旧书店</h3>
          <div class="meta"><span>探索</span><span class="dot"></span><span>90 分钟</span><span class="dot"></span><span>¥0</span><span class="dot"></span><span>城市</span></div>
          <div class="row" style="margin-top: 12px">
            <a class="btn-ghost" href="#" style="padding-left: 0">改时间</a>
            <a class="btn-ghost" href="record.html" style="color: var(--primary)">做完了</a>
          </div>
        </div>
      </div>

      <div class="ev">
        <span class="ev-mark"></span>
        <div class="ev-body">
          <p class="ev-when">周日 14:00</p>
          <h3>一口气读完一本薄书</h3>
          <div class="meta"><span>专注</span><span class="dot"></span><span>2 小时</span><span class="dot"></span><span>在家</span></div>
          <div class="row" style="margin-top: 12px">
            <a class="btn-ghost" href="#" style="padding-left: 0">改时间</a>
            <a class="btn-ghost" href="record.html" style="color: var(--primary)">做完了</a>
          </div>
        </div>
      </div>

      <p class="section-label">这段时间在别处</p>

      <label class="switch-row">
        <div>
          <p class="footnote" style="color: var(--text); font-size: 14px; margin-bottom: 4px">出差模式</p>
          <p class="footnote">打开后菜单换成：城市探索 + 酒店 15 分钟训练 + 碎片阅读</p>
        </div>
        <span class="switch">
          <input type="checkbox" />
          <span></span>
        </span>
      </label>

      <a class="card" href="menu.html" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px">
        <div>
          <p class="card-label" style="margin-bottom: 4px">下周菜单</p>
          <p class="footnote" style="color: var(--text)">周日 20:00 生成 · 也可以现在就看</p>
        </div>
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="var(--muted)" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
          <path d="M7 4l5 5-5 5" />
        </svg>
      </a>
    </main>

    <nav class="tabbar">
      <a class="tab" href="today.html">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
          <circle cx="10" cy="10" r="6.2" />
          <path d="M10 1.4v2.2M10 16.4v2.2M1.4 10h2.2M16.4 10h2.2" />
        </svg>
        <span>今天</span>
      </a>
      <a class="tab is-active" href="week.html">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
          <rect x="2.6" y="4.2" width="14.8" height="13" rx="3" />
          <path d="M6.4 2.6v3M13.6 2.6v3M2.6 8.6h14.8" />
        </svg>
        <span>本周</span>
      </a>
      <a class="tab" href="review.html">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10" cy="10" r="6.8" />
          <path d="M10 3.2v6.8l4.8 3.4" />
        </svg>
        <span>复盘</span>
      </a>
    </nav>
  </body>
</html>

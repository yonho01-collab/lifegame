<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="dsh-design" content="app" />
    <title>记录 · 人生游戏</title>
    <link rel="stylesheet" href="app.css" />
    <style>
      .done-mark {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 1px solid rgba(201, 168, 106, 0.45);
        background: rgba(201, 168, 106, 0.1);
        color: var(--primary);
        display: grid;
        place-items: center;
        margin-bottom: 16px;
      }
      .moods {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .mood {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
      }
      .mood input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
      }
      .mood span {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 6px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0;
        text-align: center;
        line-height: 1.3;
        white-space: nowrap;
      }
      .mood input:checked + span {
        border-color: var(--primary);
        background: rgba(201, 168, 106, 0.12);
        color: var(--primary);
      }
      .photo-slot {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 92px;
        border: 1px dashed var(--line);
        border-radius: var(--radius);
        color: var(--muted);
        font-size: 13px;
      }
      .photo-slot:active {
        border-color: var(--primary);
      }
      .label-sm {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.04em;
        margin: 0 0 10px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="statusbar">
      <span class="num">23:08</span>
      <span class="status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor" aria-hidden="true">
          <rect x="0" y="7" width="3" height="4" rx="1" />
          <rect x="4.5" y="5" width="3" height="6" rx="1" />
          <rect x="9" y="2.5" width="3" height="8.5" rx="1" />
          <rect x="13.5" y="0" width="3" height="11" rx="1" />
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true">
          <path d="M8 11.2 5.5 8.3a3.5 3.5 0 0 1 5 0L8 11.2Z" />
          <path d="M8 6.4c-1.7 0-3.2.6-4.4 1.8L2.4 6.9A8 8 0 0 1 8 4.5c2.2 0 4.2.9 5.6 2.4l-1.2 1.3A6.2 6.2 0 0 0 8 6.4Z" opacity=".85" />
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true">
          <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" opacity=".4" />
          <rect x="2" y="2" width="15" height="8" rx="1.5" fill="currentColor" />
          <path d="M23 4.2v3.6a2.1 2.1 0 0 0 0-3.6Z" fill="currentColor" opacity=".4" />
        </svg>
      </span>
    </div>

    <div class="navbar">
      <a class="icon-btn" href="today.html" aria-label="返回今天">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11.5 4.5 6 10l5.5 5.5" />
        </svg>
      </a>
      <span class="nav-title" style="color: var(--muted)">记录</span>
    </div>

    <main class="page" style="padding-bottom: 210px">
      <div class="done-mark">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 11.5 9 16 17.5 6.5" />
        </svg>
      </div>

      <h1 class="title-sm" style="margin-bottom: 8px">做完了</h1>
      <div class="meta" style="margin-bottom: 26px">
        <span>深度时段</span><span class="dot"></span><span class="num">21 分钟</span><span class="dot"></span><span class="num">22:47 – 23:08</span>
      </div>

      <span class="label-sm">刚才是什么感觉</span>
      <div class="moods" style="margin-bottom: 8px">
        <label class="mood"><input type="radio" name="mood" /><span>走神</span></label>
        <label class="mood"><input type="radio" name="mood" /><span>勉强</span></label>
        <label class="mood"><input type="radio" name="mood" /><span>平</span></label>
        <label class="mood"><input type="radio" name="mood" checked /><span>稳</span></label>
        <label class="mood"><input type="radio" name="mood" /><span>沉浸</span></label>
      </div>
      <p class="footnote" style="margin-bottom: 26px">不用打满分，诚实的记录更有用。</p>

      <span class="label-sm">一句话 · 留下什么</span>
      <textarea class="field" rows="3">读到讲「良质」那一段，停下来想了很久。</textarea>

      <a class="photo-slot" href="#" style="margin-top: 14px">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4.6" width="14" height="10.4" rx="2.4" />
          <path d="M6.4 4.6 7.6 2.6h2.8l1.2 2M9 12.2a2.6 2.6 0 1 0 0-5.2 2.6 2.6 0 0 0 0 5.2Z" />
        </svg>
        加一张证据（可选）
      </a>

      <hr class="divider" />

      <div class="row">
        <span class="footnote">这条进证据墙 · 第 13 条</span>
        <span class="tag">专注</span>
      </div>
    </main>

    <div class="actionbar">
      <a class="btn-primary" href="today.html">完成</a>
      <div style="text-align: center; margin-top: 10px">
        <a class="btn-ghost" href="today.html">删除这次记录</a>
      </div>
    </div>
  </body>
</html>

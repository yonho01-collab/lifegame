<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="dsh-design" content="app" />
    <title>今天 · 人生游戏</title>
    <link rel="stylesheet" href="app.css" />
    <style>
      .card-title {
        font-family: var(--font-serif);
        font-weight: 500;
        font-size: 19px;
        line-height: 1.5;
        letter-spacing: 0.03em;
        margin: 10px 0 8px;
      }
      .ghost-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="statusbar">
      <span class="num">9:41</span>
      <span class="status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor" aria-hidden="true">
          <rect x="0" y="7" width="3" height="4" rx="1" />
          <rect x="4.5" y="5" width="3" height="6" rx="1" />
          <rect x="9" y="2.5" width="3" height="8.5" rx="1" />
          <rect x="13.5" y="0" width="3" height="11" rx="1" />
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true">
          <path d="M8 11.2 5.5 8.3a3.5 3.5 0 0 1 5 0L8 11.2Z" />
          <path d="M8 6.4c-1.7 0-3.2.6-4.4 1.8L2.4 6.9A8 8 0 0 1 8 4.5c2.2 0 4.2.9 5.6 2.4l-1.2 1.3A6.2 6.2 0 0 0 8 6.4Z" opacity=".85" />
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true">
          <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" opacity=".4" />
          <rect x="2" y="2" width="15" height="8" rx="1.5" fill="currentColor" />
          <path d="M23 4.2v3.6a2.1 2.1 0 0 0 0-3.6Z" fill="currentColor" opacity=".4" />
        </svg>
      </span>
    </div>

    <main class="page has-tabbar">
      <div class="topline" style="margin-bottom: 8px">
        <span>11月26日 周四 · 感恩节</span>
        <span>降噪季 3 / 14</span>
      </div>
      <h1 class="title" style="font-size: 28px; margin-bottom: 12px">今天</h1>
      <div class="progress" style="margin-bottom: 18px"><i style="width: 21%"></i></div>

      <!-- 昨晚 -->
      <section class="card" style="padding: 14px 16px">
        <p class="brief">
          昨夜 <strong class="num">01:42</strong> 睡。<span class="dim">冥想第 3 天，别断。</span>
        </p>
      </section>

      <!-- 第一等级：地基 -->
      <p class="section-label" style="margin: 20px 0 2px">地基 · 每天三件</p>

      <label class="check-row">
        <input type="checkbox" />
        <span class="box">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.6 7.4 5.6 10.4l5.8-6.4" />
          </svg>
        </span>
        <span class="label">动一动 · 20 分钟</span>
        <span class="hint">健身房或楼下</span>
      </label>

      <label class="check-row">
        <input type="checkbox" checked />
        <span class="box">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.6 7.4 5.6 10.4l5.8-6.4" />
          </svg>
        </span>
        <span class="label">冥想 · 10 分钟</span>
        <span class="hint is-on">今天已做</span>
      </label>

      <label class="check-row">
        <input type="checkbox" />
        <span class="box">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.6 7.4 5.6 10.4l5.8-6.4" />
          </svg>
        </span>
        <span class="label">睡前手机放到客厅</span>
        <span class="hint">22:45</span>
      </label>

      <!-- 第二等级：今天一件 -->
      <p class="section-label" style="margin: 22px 0 8px">今天一件 · 第二等级</p>

      <section class="card" style="background: var(--surface-2)">
        <div class="row">
          <span class="tag">充实</span>
          <span class="meta">感恩节</span>
        </div>
        <h2 class="card-title">给一个很久没联系的人发条消息</h2>
        <p class="footnote" style="margin-bottom: 12px">
          充实这一维两周没动过。这件事只要 5 分钟，而且今天做它有点意思。
        </p>
        <div class="meta" style="margin-bottom: 16px">
          <span>5 分钟</span><span class="dot"></span><span>¥0</span><span class="dot"></span><span>在家</span>
        </div>
        <a class="btn-primary" href="today.html">做了</a>
        <div class="ghost-row">
          <a class="btn-ghost" href="today.html">换一个</a>
          <a class="btn-ghost" href="today.html">今天不做</a>
        </div>
      </section>

      <!-- 一句话 -->
      <p class="section-label" style="margin: 22px 0 8px">一句话 · 可跳过</p>
      <div class="oneliner">
        <input type="text" placeholder="今天留下什么？" aria-label="今天的一句话" />
      </div>
    </main>

    <nav class="tabbar">
      <a class="tab is-active" href="today.html">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
          <circle cx="10" cy="10" r="6.2" />
          <path d="M10 1.4v2.2M10 16.4v2.2M1.4 10h2.2M16.4 10h2.2" />
        </svg>
        <span>今天</span>
      </a>
      <a class="tab" href="week.html">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
          <rect x="2.6" y="4.2" width="14.8" height="13" rx="3" />
          <path d="M6.4 2.6v3M13.6 2.6v3M2.6 8.6h14.8" />
        </svg>
        <span>这周</span>
      </a>
      <a class="tab" href="me.html">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
          <circle cx="10" cy="10" r="3.2" />
          <path d="M10 1.6v2.6M10 15.8v2.6M1.6 10h2.6M15.8 10h2.6" />
        </svg>
        <span>我</span>
      </a>
    </nav>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="dsh-design" content="app" />
    <title>今天 · 人生游戏</title>
    <link rel="stylesheet" href="app.css" />
    <style>
      .watching {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 12px;
        margin: 0 0 20px;
        padding: 11px 13px;
        background: var(--surface);
        border-radius: var(--radius-sm);
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--muted);
        line-height: 1.7;
      }
      .watching .wlabel {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--primary);
        letter-spacing: 0.14em;
      }
      .watching .wdot {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: var(--line);
      }
      .watching .wlabel::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--primary);
      }
      .done-line {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.02em;
        margin: 0 0 24px;
      }
      .done-line b {
        color: var(--primary);
        font-weight: 400;
      }
      .now-time {
        font-size: 11px;
        letter-spacing: 0.22em;
        color: var(--primary);
        margin: 0 0 10px;
      }
      .now-title {
        font-family: var(--font-serif);
        font-weight: 500;
        font-size: 30px;
        line-height: 1.35;
        letter-spacing: 0.04em;
        margin: 0 0 10px;
      }
      .now-why {
        font-size: 14px;
        line-height: 1.7;
        color: var(--muted);
        margin: 0 0 18px;
      }
      .now-actions {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .now-actions .btn-primary {
        flex: 1 1 auto;
        width: auto;
      }
      .later-row {
        display: flex;
        align-items: baseline;
        gap: 14px;
        padding: 11px 0;
        border-bottom: 1px solid var(--line);
      }
      .later-row:last-child {
        border-bottom: 0;
      }
      .later-row .t {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.04em;
        flex: 0 0 46px;
        font-variant-numeric: tabular-nums;
      }
      .later-row .n {
        font-size: 14px;
        color: var(--text);
        line-height: 1.5;
      }
      .teaser {
        padding: 16px;
        border: 1px dashed var(--line);
        border-radius: var(--radius);
      }
    </style>
  </head>
  <body>
    <div class="statusbar">
      <span class="num">19:35</span>
      <span class="status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor" aria-hidden="true">
          <rect x="0" y="7" width="3" height="4" rx="1" />
          <rect x="4.5" y="5" width="3" height="6" rx="1" />
          <rect x="9" y="2.5" width="3" height="8.5" rx="1" />
          <rect x="13.5" y="0" width="3" height="11" rx="1" />
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true">
          <path d="M8 11.2 5.5 8.3a3.5 3.5 0 0 1 5 0L8 11.2Z" />
          <path d="M8 6.4c-1.7 0-3.2.6-4.4 1.8L2.4 6.9A8 8 0 0 1 8 4.5c2.2 0 4.2.9 5.6 2.4l-1.2 1.3A6.2 6.2 0 0 0 8 6.4Z" opacity=".85" />
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true">
          <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" opacity=".4" />
          <rect x="2" y="2" width="15" height="8" rx="1.5" fill="currentColor" />
          <path d="M23 4.2v3.6a2.1 2.1 0 0 0 0-3.6Z" fill="currentColor" opacity=".4" />
        </svg>
      </span>
    </div>

    <main class="page has-tabbar">
      <div class="topline" style="margin-bottom: 8px">
        <span>11月27日 周五</span>
        <span>降噪季 4 / 14</span>
      </div>
      <h1 class="title" style="font-size: 28px; margin-bottom: 14px">今天</h1>

      <div class="watching">
        <span class="wlabel">它在看着</span>
        <span>你 3 天没动</span>
        <span class="wdot"></span>
        <span>今晚 19:00 后空窗</span>
        <span class="wdot"></span>
        <span>周三降温，户外改周四</span>
      </div>

      <p class="done-line">
        <b>今早已完成</b> 冥想 10 分钟 · 动一动 20 分钟
      </p>

      <!-- 此刻 -->
      <p class="now-time">现在 19:35</p>
      <h1 class="now-title">写 200 字</h1>
      <p class="now-why">
        今天早上你把它排在第三件。不拘内容，写完就算——<br />
        不用写得好。
      </p>
      <div class="now-actions">
        <a class="btn-primary" href="focus.html">开始</a>
        <a class="btn-ghost" href="today.html">晚点再说</a>
      </div>

      <!-- 之后 -->
      <p class="section-label" style="margin: 26px 0 2px">之后</p>
      <div>
        <div class="later-row">
          <span class="t">21:30</span>
          <span class="n">读《禅与摩托车维修艺术》20 分钟</span>
        </div>
        <div class="later-row">
          <span class="t">22:45</span>
          <span class="n">手机放到客厅</span>
        </div>
        <div class="later-row">
          <span class="t">00:15</span>
          <span class="n">关灯 · 目标 00:30 前睡着</span>
        </div>
      </div>

      <!-- 明天 -->
      <p class="section-label" style="margin: 28px 0 8px">明天给你留了一件</p>
      <div class="teaser">
        <p class="lead" style="font-size: 14px; margin-bottom: 6px">
          去城南那家面包店，坐 20 分钟。
        </p>
        <p class="footnote">周六上午人少，面包刚出炉。不用现在决定。</p>
      </div>
    </main>

    <nav class="tabbar">
      <a class="tab is-active" href="today.html">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
          <circle cx="10" cy="10" r="6.2" />
          <path d="M10 1.4v2.2M10 16.4v2.2M1.4 10h2.2M16.4 10h2.2" />
        </svg>
        <span>今天</span>
      </a>
      <a class="tab" href="week.html">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
          <rect x="2.6" y="4.2" width="14.8" height="13" rx="3" />
          <path d="M6.4 2.6v3M13.6 2.6v3M2.6 8.6h14.8" />
        </svg>
        <span>本周</span>
      </a>
      <a class="tab" href="me.html">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
          <circle cx="10" cy="10" r="3.2" />
          <path d="M10 1.6v2.6M10 15.8v2.6M1.6 10h2.6M15.8 10h2.6" />
        </svg>
        <span>我</span>
      </a>
    </nav>
  </body>
</html>

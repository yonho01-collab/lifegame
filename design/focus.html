<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="dsh-design" content="app" />
    <title>深度时段 · 人生游戏</title>
    <link rel="stylesheet" href="app.css" />
    <style>
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .focus-main {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 24px 140px;
        text-align: center;
      }
      .ring-wrap {
        position: relative;
        width: min(260px, 74vw);
        aspect-ratio: 1;
        margin-bottom: 8px;
      }
      .ring-wrap svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .ring-inner {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .elapsed {
        font-family: var(--font-serif);
        font-size: 44px;
        font-weight: 500;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
        line-height: 1.24;
        color: var(--accent);
      }
      .elapsed-label {
        font-size: 11px;
        letter-spacing: 0.22em;
        color: var(--muted);
      }
      .now-reading {
        font-family: var(--font-serif);
        font-size: 20px;
        font-weight: 500;
        letter-spacing: 0.04em;
        line-height: 1.5;
        margin: 0 0 4px;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.04em;
      }
      .focus-foot {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 0 20px 34px;
        text-align: center;
      }
      .focus-foot .note {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.7;
        margin: 12px 0 0;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="statusbar" style="opacity: 0.5">
      <span class="num">22:47</span>
      <span class="status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor" aria-hidden="true">
          <rect x="0" y="7" width="3" height="4" rx="1" />
          <rect x="4.5" y="5" width="3" height="6" rx="1" />
          <rect x="9" y="2.5" width="3" height="8.5" rx="1" />
          <rect x="13.5" y="0" width="3" height="11" rx="1" />
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true">
          <path d="M8 11.2 5.5 8.3a3.5 3.5 0 0 1 5 0L8 11.2Z" />
          <path d="M8 6.4c-1.7 0-3.2.6-4.4 1.8L2.4 6.9A8 8 0 0 1 8 4.5c2.2 0 4.2.9 5.6 2.4l-1.2 1.3A6.2 6.2 0 0 0 8 6.4Z" opacity=".85" />
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true">
          <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" opacity=".4" />
          <rect x="2" y="2" width="15" height="8" rx="1.5" fill="currentColor" />
          <path d="M23 4.2v3.6a2.1 2.1 0 0 0 0-3.6Z" fill="currentColor" opacity=".4" />
        </svg>
      </span>
    </div>

    <div class="navbar">
      <a class="icon-btn" href="today.html" aria-label="返回今天">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11.5 4.5 6 10l5.5 5.5" />
        </svg>
      </a>
      <span class="nav-title" style="color: var(--muted)">深度时段</span>
    </div>

    <main class="focus-main">
      <div class="ring-wrap">
        <svg viewBox="0 0 260 260" aria-hidden="true">
          <circle cx="130" cy="130" r="110" fill="none" stroke="#2C2C30" stroke-width="1.5" />
          <circle
            cx="130"
            cy="130"
            r="110"
            fill="none"
            stroke="#C9A86A"
            stroke-width="2"
            stroke-linecap="round"
            stroke-dasharray="390.5 691.15"
            transform="rotate(-90 130 130)"
          />
        </svg>
        <div class="ring-inner">
          <span class="elapsed num">11:18</span>
          <span class="elapsed-label">已沉浸</span>
        </div>
      </div>

      <p class="now-reading">《禅与摩托车维修艺术》</p>
      <p class="hint">手机在客厅 · 这一屏不会有任何通知</p>
    </main>

    <div class="focus-foot">
      <a class="btn-primary" href="record.html">结束并记录</a>
      <p class="note">中途拿起手机，这一节就算结束——下次从 10 分钟重新开始。</p>
    </div>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="dsh-design" content="app" />
    <title>专注 · 人生游戏</title>
    <link rel="stylesheet" href="app.css" />
    <style>
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .focus-main {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 24px 150px;
        text-align: center;
      }
      .ring-wrap {
        position: relative;
        width: min(250px, 72vw);
        aspect-ratio: 1;
        margin: 18px 0 4px;
      }
      .ring-wrap svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .ring-inner {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .left {
        font-family: var(--font-serif);
        font-size: 42px;
        font-weight: 500;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
        line-height: 1.24;
        color: var(--accent);
      }
      .left-label {
        font-size: 11px;
        letter-spacing: 0.22em;
        color: var(--muted);
      }
      .doing {
        font-family: var(--font-serif);
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.04em;
        line-height: 1.5;
        margin: 0 0 6px;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.04em;
      }
      .focus-foot {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 0 20px 34px;
        text-align: center;
      }
      .focus-foot .note {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.7;
        margin: 12px 0 0;
      }
    </style>
  </head>
  <body>
    <div class="statusbar" style="opacity: 0.62">
      <span class="num">19:41</span>
      <span class="status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor" aria-hidden="true">
          <rect x="0" y="7" width="3" height="4" rx="1" />
          <rect x="4.5" y="5" width="3" height="6" rx="1" />
          <rect x="9" y="2.5" width="3" height="8.5" rx="1" />
          <rect x="13.5" y="0" width="3" height="11" rx="1" />
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true">
          <path d="M8 11.2 5.5 8.3a3.5 3.5 0 0 1 5 0L8 11.2Z" />
          <path d="M8 6.4c-1.7 0-3.2.6-4.4 1.8L2.4 6.9A8 8 0 0 1 8 4.5c2.2 0 4.2.9 5.6 2.4l-1.2 1.3A6.2 6.2 0 0 0 8 6.4Z" opacity=".85" />
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true">
          <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" opacity=".4" />
          <rect x="2" y="2" width="15" height="8" rx="1.5" fill="currentColor" />
          <path d="M23 4.2v3.6a2.1 2.1 0 0 0 0-3.6Z" fill="currentColor" opacity=".4" />
        </svg>
      </span>
    </div>

    <div class="navbar">
      <a class="icon-btn" href="today.html" aria-label="退出专注">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
          <path d="M4.5 4.5l9 9M13.5 4.5l-9 9" />
        </svg>
      </a>
    </div>

    <main class="focus-main">
      <p class="doing">写 200 字</p>
      <p class="hint" style="margin-bottom: 4px">20 分钟 · 这一屏不会有任何通知</p>

      <div class="ring-wrap">
        <svg viewBox="0 0 260 260" aria-hidden="true">
          <circle cx="130" cy="130" r="110" fill="none" stroke="#26262B" stroke-width="1.5" />
          <circle
            cx="130"
            cy="130"
            r="110"
            fill="none"
            stroke="#C9A86A"
            stroke-width="2"
            stroke-linecap="round"
            stroke-dasharray="194.9 691.15"
            transform="rotate(-90 130 130)"
          />
        </svg>
        <div class="ring-inner">
          <span class="left num">14:22</span>
          <span class="left-label">还剩</span>
        </div>
      </div>
    </main>

    <div class="focus-foot">
      <a class="btn-primary" href="today.html">完成了</a>
      <p class="note">做完自动算进今天，不用回来打勾。</p>
    </div>
  </body>
</html>
